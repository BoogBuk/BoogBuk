
name: Generate contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: BoogBuk
          outputs: |
            dist/github-snake.svg?color_snake=%236F4E37&color_dots=%23F5F0E8,%23E7DCCB,%23C5A880,%238B6F47,%234B3621
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23C5A880

      - name: Publish snake images
        run: |
          mkdir -p assets
          cp dist/github-snake.svg assets/github-snake.svg
          cp dist/github-snake-dark.svg assets/github-snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution snake"
            git push
          fi
